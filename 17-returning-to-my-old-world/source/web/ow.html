  U.fogNear.value = v.fogNear ?? 70; U.fogFar.value = v.fogFar ?? 125;

  armCam.fov = 70; armCam.aspect = W_ / H_; armCam.updateProjectionMatrix();
  camera.position.set(...v.pos);
  const yaw = THREE.MathUtils.degToRad(v.yaw), pitch = THREE.MathUtils.degToRad(v.pitch), roll = THREE.MathUtils.degToRad(v.roll || 0);
  camera.rotation.set(0, 0, 0); camera.rotation.order = 'YXZ';

  sky.position.copy(camera.position);
  sun.position.copy(camera.position).addScaledVector(U.sunDir.value, 500); sun.lookAt(camera.position);
  cloudGroup.position.set((v.time || 0) * 1.1 - 380, 0, -380);
  // door
  doorPivot.rotation.y = -Math.PI / 2 * (v.door || 0);
  const dl = lightAt(new THREE.Vector3(meta.door.x + 0.5, meta.door.y + 1, meta.door.z + 0.5));
  const dc = door.children[0].children; for (const m of dc) { const c = m.geometry.attributes.color; for (let i = 0; i < c.count; i++) c.setXYZ(i, dl.x * 0.85, dl.y * 0.85, dl.z * 0.85); c.needsUpdate = true; }
  // wolf
  if (v.wolf) { wolf.visible = true; poseWolf(v.wolf); } else wolf.visible = false;
  hearts.forEach((h, i) => { const q = (v.hearts || [])[i]; h.visible = !!q; if (q) { h.position.set(q[0], q[1], q[2]); h.scale.setScalar(q[3] || 0.3); } });
  renderer.setClearColor(0x000000, 1); renderer.clear();
  renderer.render(scene, camera);
  if (v.arm) {
    const a = v.arm;
    const P = window.ARMP || { x: 0.3, y: -0.64, z: -0.5, rx: 100, ry: 20, rz: 8 };
    arm.position.set(P.x + (a.bx || 0), P.y + (a.by || 0) - (a.drop || 0), P.z + (a.bz || 0));
    arm.rotation.set(THREE.MathUtils.degToRad(P.rx + (a.swing || 0) * 32), THREE.MathUtils.degToRad(P.ry + (a.swing || 0) * 10), THREE.MathUtils.degToRad(P.rz - (a.swing || 0) * 6), 'YXZ');
    const L = lightAt(new THREE.Vector3(...v.pos)); armMat.uniforms.uLight.value.copy(L); armMat2.uniforms.uLight.value.copy(L);
    renderer.clearDepth(); renderer.render(armScene, armCam);
  }
  return renderer.domElement.toDataURL('image/png');
};
